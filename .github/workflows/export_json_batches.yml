name: Export JSON batches - up to 1000 drugs each

on:
  # Trigger one initial run when this workflow is first added.
  push:
    paths:
      - '.github/workflows/export_json_batches.yml'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Drugs per JSON file (never more than 1000)'
        type: choice
        options: ['1000', '500']
        default: '1000'
        required: true

permissions:
  contents: read

concurrency:
  group: export-json-batches-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export:
    name: Convert full source, validate IDs, export JSON-only ZIP artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run automated tests (offline)
        run: python -m unittest discover -s tests -v
      - name: Convert all upstream drugs to the established 96-field format
        run: |
          python convert.py --download --sample 0 \
            --expected-min-rows 20000 --output-dir full_catalog
      - name: Verify the full conversion against the original source count
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('full_catalog')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          rows = json.loads((root / 'drugs_96_DRAFT.json').read_text(encoding='utf-8'))
          assert manifest['converted_records'] == manifest['source_records_total'] == len(rows)
          assert not manifest['is_sample']
          assert all(len(r) == 96 and r['is_active'] == 0 for r in rows)
          print('Verified full conversion:', len(rows), 'drugs in original order.')
          PY
      - name: Split JSON batches and verify zero repeats, no omissions or altered records
        id: split
        env:
          BATCH_SIZE: ${{ inputs.batch_size || '1000' }}
        run: |
          python split_artifacts.py \
            --input full_catalog/drugs_96_DRAFT.json \
            --output-dir json_batches \
            --batch-size "$BATCH_SIZE" \
            --github-output "$GITHUB_OUTPUT"
      # IMPORTANT: Only json_batches/batch_NN.json are uploaded below. The source
      # database, original records, manifests, caches and CSV reports stay on
      # the transient runner, and are NOT included in any ZIP artifact.
      - name: Upload JSON batch 01 (one JSON file, <= 1000 drugs)
        if: ${{ fromJSON(steps.split.outputs.batch_count) >= 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: drugs-96-json-batch-01
          path: json_batches/batch_01.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Upload JSON batch 02 (one JSON file, <= 1000 drugs)
        if: ${{ fromJSON(steps.split.outputs.batch_count) >= 2 }}
        uses: actions/upload-artifact@v4
        with:
          name: drugs-96-json-batch-02
