name: Fast multilingual drug research - catalog and official sources

on:
  push:
    paths:
      - '.github/workflows/fast_drug_research.yml'
  workflow_dispatch:
    inputs:
      query:
        description: 'Search Arabic or English drug name, ingredient, strength, barcode, ID'
        type: string
        default: 'metformin'
        required: true
      max_records:
        description: 'Distinct catalog products to research against official sources'
        type: choice
        options: ['3', '5', '10', '20']
        default: '5'
        required: true
      official_sources:
        description: 'Search RxNorm, openFDA and DailyMed (review only)'
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: fast-drug-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  researcher:
    name: Benchmark full catalog and lookup official references
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Restore recent public research cache (14-day per-file TTL)
        uses: actions/cache@v4
        with:
          path: .research_cache
          key: pharma-research-cache-${{ runner.os }}-v2-${{ github.run_id }}
          restore-keys: |
            pharma-research-cache-${{ runner.os }}-v2-
      - name: Convert full upstream source into temporary catalog
        run: |
          python convert.py --download --sample 0 \
            --include-catalog-details \
            --expected-min-rows 20000 --output-dir catalog_temp
      - name: Benchmark indexed multilingual retrieval
        env:
          QUERY: ${{ inputs.query || 'metformin' }}
        run: |
          python fast_search.py \
            --input catalog_temp/drugs_96_DRAFT.json \
            --query "$QUERY" \
            --limit 10 \
            --benchmark --benchmark-count 250 \
            --output research_output/catalog_search_and_benchmark.json
      - name: Build persistent SQLite FTS5 search index for the converted catalog
        run: |
          python fast_drug_search.py \
            --build-from catalog_temp/drugs_96_DRAFT.json \
            --index research_index.sqlite3
      - name: Search with ranked BM25 and fuzzy Arabic-English candidates
        env:
          QUERY: ${{ inputs.query || 'metformin' }}
        run: |
          python fast_drug_search.py \
            --index research_index.sqlite3 \
            --query "$QUERY" --limit 20 \
            > research_output/fts5_ranked_search.json
      - name: Check unique IDs and no product-equivalence claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('research_output/fts5_ranked_search.json').read_text(encoding='utf-8'))
          rows = data['results']
          assert len({r['id'] for r in rows}) == len(rows)
          assert all(r['clinical_equivalence_verified'] is False for r in rows)
          print('FTS5 ranked results:',len(rows))
          PY
      - name: Search official sources with bounded parallelism and caching
        if: ${{ github.event_name == 'push' || inputs.official_sources }}
        env:
          QUERY: ${{ inputs.query || 'metformin' }}
          MAX_RECORDS: ${{ inputs.max_records || '5' }}
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
        run: |
          python research_batch.py \
            --input catalog_temp/drugs_96_DRAFT.json \
            --query "$QUERY" \
            --max-records "$MAX_RECORDS" \
            --workers 2 \
            --cache-dir .research_cache \
            --output research_output/medical_sources_REVIEW_ONLY.json
      - name: Ensure medical evidence remains research only
        if: ${{ github.event_name == 'push' || inputs.official_sources }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('research_output/medical_sources_REVIEW_ONLY.json').read_text(encoding='utf-8'))
          rows = result['drugs']
          assert result['clinical_use_allowed'] is False
          assert all(r['clinical_use_allowed'] is False for r in rows)
          assert all(r['fda_label_is_verified_egyptian_product'] is False for r in rows)
          assert all(r['auto_merged_into_json_batches'] is False for r in rows)
          assert all(r['review_required'] is True for r in rows)
          assert len({r['id'] for r in rows}) == len(rows)
          print('VALIDATED:', len(rows), 'product references,',
                result['unique_ingredient_queries'], 'deduplicated ingredients')
          PY
      - name: Compare original converted drugs with official research evidence
        if: ${{ github.event_name == 'push' || inputs.official_sources }}
        run: |
          python compare_research.py \
            --catalog catalog_temp/drugs_96_DRAFT.json \
            --research research_output/medical_sources_REVIEW_ONLY.json \
            --output research_output/comparison_REVIEW_ONLY.json \
            --review-template research_output/product_review_NOT_APPROVED.json
      - name: Validate comparison, identity preservation and review-only gate
        if: ${{ github.event_name == 'push' || inputs.official_sources }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          converted = json.loads(Path('catalog_temp/drugs_96_DRAFT.json').read_text(encoding='utf-8'))
          research = json.loads(Path('research_output/medical_sources_REVIEW_ONLY.json').read_text(encoding='utf-8'))
          report = json.loads(Path('research_output/comparison_REVIEW_ONLY.json').read_text(encoding='utf-8'))
          templates = json.loads(Path('research_output/product_review_NOT_APPROVED.json').read_text(encoding='utf-8'))
          assert report['catalog_records'] == len(converted)
          assert report['compared_records'] == len(research['drugs'])
          assert report['automatic_merge_allowed'] is False
          assert len({r['id'] for r in report['results']}) == len(report['results'])
          assert all(r['automatic_merge_allowed'] is False and r['catalog_unchanged'] is True
                     for r in report['results'])
          assert all(t['approved'] is False and all(v == '' for v in t['reviewed_fields'].values())
                     for t in templates)
          assert all(r['is_active'] == 0 for r in converted)
          print('COMPARATOR CONNECTED:', len(report['results']), 'drugs,',
                len(templates), 'unapproved review templates,',
                'identity discrepancies:',report['counts'].get('REJECTED_IDENTITY_MISMATCH',0))
          PY
      - name: Upload researcher JSON reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-drug-research-REVIEW-ONLY
          path: research_output/*.json
          if-no-files-found: warn
          retention-days: 14
